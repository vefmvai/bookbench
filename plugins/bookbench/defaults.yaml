# BookBench plugin defaults
#
# This file holds genre defaults that are inherited by a new book at /book:start.
# After /book:start the values are copied into .book/config.yaml and into per-role
# guideline templates; from then on the book has its own copy and is unaffected
# by changes here. To re-pull defaults into an existing book use the optional
# /book:update --reset-defaults (planned for 0.2+, see CFG-2).
#
# Schema version is bumped on incompatible changes; the loader migrates books
# whose schema_version is older.

schema_version: 1

# ============================================================
# Model profiles — strata of the nine subagent roles
# ============================================================
# Three named profiles map every role to a concrete Claude model alias
# (opus | sonnet | haiku). The book picks one profile via
# `.book/config.yaml > agents.profile`; a per-role override can be
# applied via `.book/config.yaml > agents.model_overrides`.
#
# Cascade of precedence (lowest to highest):
#   defaults.yaml.profiles.<profile_name>.<role>
#     → .book/config.yaml.agents.profile (selects the profile)
#       → .book/config.yaml.agents.model_overrides.<role>  (last word)
#
# Hard constraints — enforced in every profile:
#   • strategist / writer / marketer = opus  (creative core, untouchable)
#   • classifier = haiku  (the task is trivial and high-volume)
#
# Why profiles exist at all: a flat `inherit` policy makes every Task
# inherit Opus from the main thread, which exhausts a Pro plan after
# 1–2 sections. Profiles spread the load across model tiers so the
# framework stays usable on smaller subscriptions.

default_profile: balanced

profiles:

  # ----------------------------------------------------------
  # budget — Claude Pro and similarly constrained plans
  # ----------------------------------------------------------
  # Goal: fit the section micro-cycle into a Pro plan's daily Opus
  # quota. Creative core stays on Opus (those are the roles whose
  # output the reader actually sees). Verify / orchestrate / classify
  # roles drop to Haiku, EXCEPT factchecker — fact verification
  # demands more nuance than Haiku can reliably deliver
  # (see PS-14.1-02). The tuner runs rarely (only on /book:tune)
  # and analyses logs, so Haiku is sufficient there.
  budget:
    coordinator: haiku        # orchestrates file passes; no creative load
    strategist: opus          # creative core — untouchable
    writer: opus              # creative core — untouchable
    factchecker: sonnet       # verification needs nuance (PS-14.1-02)
    editor: haiku             # mechanical compaction + cliché check
    marketer: opus            # creative core — untouchable
    classifier: haiku         # trivial classification
    synthesizer: haiku        # mechanical compose for import
    tuner: haiku              # rare batch analysis of TUNING-LOG

  # ----------------------------------------------------------
  # balanced — Claude Max-5x (recommended default)
  # ----------------------------------------------------------
  # Goal: comfortable quality on a typical paid plan. Mirrors the
  # baseline distribution shipped in agent body frontmatter.
  # Creative core on Opus, verify/compose roles on Sonnet,
  # classifier on Haiku.
  balanced:
    coordinator: sonnet       # orchestrate
    strategist: opus          # creative core
    writer: opus              # creative core
    factchecker: sonnet       # verify
    editor: sonnet            # verify / compact
    marketer: opus            # creative core
    classifier: haiku         # classify
    synthesizer: sonnet       # compose
    tuner: sonnet             # analyse

  # ----------------------------------------------------------
  # quality — Claude Max-20x or API access
  # ----------------------------------------------------------
  # Goal: maximum quality where budget is not a constraint.
  # Synthesizer is promoted to Opus because it composes import
  # materials whose quality bottlenecks every later phase.
  # Other Sonnet roles (coordinator/editor/factchecker/tuner)
  # stay on Sonnet — promoting verify/orchestrate roles to Opus
  # rarely yields measurable gains for the cost (see PS-14.1-03).
  # Classifier stays on Haiku in every profile — promoting it
  # would waste tokens on a deterministic task.
  quality:
    coordinator: sonnet       # orchestrate (Opus brings no value here)
    strategist: opus          # creative core
    writer: opus              # creative core
    factchecker: sonnet       # verify
    editor: sonnet            # verify / compact
    marketer: opus            # creative core
    classifier: haiku         # classify (NEVER promote — PS-14.1-03)
    synthesizer: opus         # promoted: import compose is upstream of all later phases
    tuner: sonnet             # analyse

genres:

  # ============================================================
  # Genre: popular-science (full support, default for 0.1)
  # ============================================================
  popular-science:

    # compatible_formats — D-30 (etap 20): formats this genre is normally
    # paired with. Used by /book:start coach-mode to narrow format hypothesis,
    # and by /book:doctor to validate consistency. See formats-design.md.
    compatible_formats: ["book", "article", "long-read"]

    # writing — quantitative parameters of the writing process
    # (mirrors Q1..Q19 from quantitative-checklists.md, etap 11)
    writing:

      # Q1 — target section length (chars). Range: 15000-25000.
      section_target_chars: 20000

      # Q2 — minimum section length (chars). Editor returns revise if below.
      section_min_chars: 15000

      # Q3 — maximum section length (chars). Editor cuts if above.
      section_max_chars: 25000

      # Q4 — writer self-check checkpoint, every N chars.
      writer_checkpoint_step_chars: 5000

      # Q5 — emotional addresses to the reader per section.
      emotional_addresses_per_section:
        min: 3
        max: 4

      # Q6 — minimum chars in a section-to-section transition.
      transition_min_chars: 1500

      # Q7 — minimum paragraphs in a transition.
      transition_min_paragraphs: 3

      # Q8 — pyramid supports per section.
      pyramid_supports_per_section:
        min: 3
        max: 4

      # Q9 — concrete anchors per abstract claim.
      concrete_anchors_per_abstract_claim:
        min: 2
        max: 4

      # Q10 — modern examples year window. Override per book.
      modern_examples_year_range:
        from: 2020
        to: 2024

      # Q11 — editor's "ten-percent rule" target reduction.
      editor_reduction_target_percent: 10

      # Q12 — number of editor anti-cliche audit passes.
      audit_pass_count: 2

      # Q13 — forbid math formulas in the body of the section.
      forbid_math_formulas: true

      # Q14 — forbid code blocks in the body of the section.
      forbid_code_blocks: true

      # Q15 — dash typography for the voice profile.
      # medium = "–" (U+2013); long = "—" (U+2014).
      dash_type: medium

      # Q16 — Twitter snippet length range (chars).
      twitter_snippet_chars:
        min: 140
        max: 150

      # Q17 — Telegram post length range (chars).
      telegram_post_chars:
        min: 1000
        max: 2000

      # Q18 — Midjourney prompt length range (words).
      midjourney_prompt_words:
        min: 50
        max: 100

      # Q19 — alternative concepts when the marketer hits creative block.
      alternative_concepts_count:
        min: 3
        max: 5

      # Summary length per section (words).
      summary_max_words: 500

    # agents — composition and limits of the team for this genre
    agents:
      enabled:
        - coordinator
        - strategist
        - writer
        - factchecker
        - editor
        - marketer
        - classifier      # /book:import only
        - synthesizer     # /book:import only
        - tuner           # /book:tune only
      # models — informational fallback for older books that pin a model
      # per role at the genre level. Modern books rely on profiles above
      # (see `default_profile` and `profiles:`); this map mirrors the
      # `balanced` profile and is kept for backward compatibility only.
      models:
        coordinator: sonnet
        strategist: opus
        writer: opus
        factchecker: sonnet
        editor: sonnet
        marketer: opus
        classifier: haiku
        synthesizer: sonnet
        tuner: sonnet
      loop_limits:
        factchecker_writer_revise: 3        # DEC-03
        editor_factchecker_recheck: 1

    # quality_gates — pass/fail thresholds for the section micro-cycle
    quality_gates:
      min_factcheck_pass_rate: 0.95
      max_anti_cliche_violations: 0
      min_cohesion_score: 0.7

    # guidelines — starting content for .book/agent-guidelines/<role>/<file>.md
    guidelines:
      writer:
        forbidden-phrases:
          # The 12 highest-priority Russian patterns from anti-ai-cliche corpus
          # (full corpus lives in skills/anti-ai-cliche/references/).
          - "удивительный мир"
          - "погружаемся в"
          - "раскроем тайны"
          - "приоткрываем тайну"
          - "Вы не поверите"
          - "Шокирующая правда"
          - "отправимся в путешествие"
          - "Отличный вопрос"
          - "В заключение"
          - "Не вызывает сомнений"
          - "Учёные были в шоке"
          - "В этой главе вы узнаете"
          # English/promotional standards from the 34-pattern English corpus
          - "delve into"
          - "as of my last training"
          - "I hope this helps"
          - "Let me know if"
          - "stands as a testament"
          - "shaping the future"
          - "groundbreaking"
        favorite-metaphors: []   # author fills during the book
      factchecker:
        trusted-sources:
          - "Peer-reviewed journals indexed in Web of Science"
          - "Textbooks of the last five years from established academic publishers"
          - "Books by recognised specialists with multiple reprints"
          - "Field-specific authoritative databases (per topic, see book guidelines)"
        outdated-sources:
          - "Pre-prints older than five years without follow-up publications"
          - "Articles in non-indexed or predatory journals"
        claim-tags-rules:
          - "VERIFIED — only when matched against ≥2 independent trusted sources"
          - "ASSUMED requires hedging in the section body"
      editor:
        cohesion-rules:
          - "An adjacent section may forward-reference the next only via an explicit teaser"
          - "Red-thread keywords appear at least once in the first and last paragraph"
        author-deviations: []
      strategist:
        structural-rules:
          - "Five-act structure for sections longer than 5000 words"
          - "Foreshadowing required in the first third of the book"
        section-checklist:
          - "spec.md has a single governing thought (tagline)"
          - "spec.md lists 3–4 supports each with 2+ concrete anchor proposals"
          - "spec.md includes a plot connector to section N-1"
      marketer:
        telegram-tone:
          - "Use emojis sparingly; avoid call-to-action verbs"
          - "Post length: 1000–2000 chars"
        brand-voice: []
        visual-blacklist-extras: []
      classifier: {}
      synthesizer: {}
      tuner:
        analysis-rules:
          - "Count a pattern only when it has at least three same-kind REJECTIONS"
          - "Ignore single typos"
        sensitivity-thresholds:
          min_occurrences_for_pattern: 3
          critical_threshold: 0.8
          important_threshold: 0.4

  # ============================================================
  # Genre: fiction (placeholder for 0.2+, generated by genre-researcher)
  # ============================================================
  fiction:
    # compatible_formats — D-30 (etap 20). On 0.3.0 only [book].
    # TODO 0.4+ — once short-story / novella / novel formats land in defaults.yaml > formats:
    # (per RD-20-C: "novel/novella/short-story are formats, not genres"), expand to
    # [short-story, novella, novel, book].
    compatible_formats: ["book"]
    # TODO 0.2+ — generated by genre-researcher on demand or shipped in 0.2.
    writing: {}
    agents: {}
    quality_gates: {}
    guidelines: {}

  # ============================================================
  # Genre: monograph (placeholder for 0.2+)
  # ============================================================
  monograph:
    # compatible_formats — D-30 (etap 20).
    # TODO 0.2+ — refine when this genre is fully implemented.
    # NOTE: "dissertation" added to keep symmetry with formats.dissertation.compatible_genres
    # (academic monograph as a genre is a natural target for the dissertation format).
    compatible_formats: ["monograph", "book", "dissertation"]
    # TODO 0.2+ — generated by genre-researcher on demand or shipped in 0.2.
    writing: {}
    agents: {}
    quality_gates: {}
    guidelines: {}

  # ============================================================
  # Genre template — used by genre-researcher to generate new genres
  # ============================================================
  .template:
    # compatible_formats — D-30 (etap 20). Empty by default;
    # /book:research-genre fills this when generating a new genre preset.
    compatible_formats: []
    writing: {}
    agents: {}
    quality_gates: {}
    guidelines: {}

# ============================================================
# Formats — physical-form library (D-30, etap 20)
# ============================================================
# Four orthogonal dimensions of any text are: genre / style / format / audience
# (see decisions-20.md). This section is the format library — a first-class
# extensible registry alongside genres above.
#
# Each format preset describes the physical form of the work:
#   • section_word        — the unit-of-work word used in author dialogues
#                           (section / part / paragraph)
#   • section_chars_range — typical length of one section in chars
#   • document_sections_range — typical number of sections per document
#   • structure_skeleton  — structural skeleton (whether plan-book.md is needed,
#                           standard layout, narrative arc requirements)
#   • factcheck_density   — standard | enhanced
#   • marketing_mode      — one-promo-per-document | promo-per-section | minimal
#   • compatible_genres   — reverse link for library consistency
#                           (must match genres.<name>.compatible_formats)
#
# Extensibility: extra formats are generated via /book:research-format
# (specced in stage 20, implemented in stage 22 per RD-20-A) and saved to
# ${CLAUDE_PLUGIN_DATA}/user-formats/<name>.yaml. Local user formats override
# built-in formats with the same name (cascade per D-17).
#
# All numeric defaults below are tagged default_for: "0.3.0" — they reflect
# typical publishing conventions and may be tuned by feedback without bumping
# schema_version.
#
# Flat dictionary, no grouping (RD-20-D). Group short_form / long_form may be
# introduced in 0.4+ if the registry exceeds ~10 formats.
formats:

  article:
    display_name_ru: "статья"
    section_word: "раздел"
    section_chars_range: { min: 5000, max: 12000 }
    document_sections_range: { min: 3, max: 7 }
    structure_skeleton: "сквозная мысль через все разделы; plan-book.md не обязателен (короткий план в STATE.md достаточен)"
    factcheck_density: "standard"
    marketing_mode: "one-promo-per-document"
    compatible_genres: ["popular-science"]
    default_for: "0.3.0"

  long-read:
    display_name_ru: "лонгрид"
    section_word: "часть"
    section_chars_range: { min: 12000, max: 25000 }
    document_sections_range: { min: 4, max: 8 }
    structure_skeleton: "краткий план (2-3 уровня), сквозной нарратив; plan-book.md рекомендуется в коротком виде"
    factcheck_density: "standard"
    marketing_mode: "one-promo-per-document"
    compatible_genres: ["popular-science"]
    default_for: "0.3.0"

  book:
    display_name_ru: "книга"
    section_word: "глава"
    section_chars_range: { min: 20000, max: 40000 }
    document_sections_range: { min: 7, max: 15 }
    structure_skeleton: "обязательный plan-book.md с сюжетной или тематической аркой; пять-актная структура для художки или классическая трёхактная для нон-фикшна"
    factcheck_density: "standard"
    marketing_mode: "promo-per-section"
    compatible_genres: ["popular-science", "fiction", "monograph"]
    default_for: "0.3.0"

  monograph:
    display_name_ru: "монография"
    section_word: "глава"
    section_chars_range: { min: 35000, max: 60000 }
    document_sections_range: { min: 8, max: 12 }
    structure_skeleton: "жёсткий научный план; обязательный plan-book.md с теоретической базой, методологией, разделами анализа, выводами"
    factcheck_density: "enhanced"
    marketing_mode: "promo-per-section"
    compatible_genres: ["monograph"]
    default_for: "0.3.0"

  dissertation:
    display_name_ru: "диссертация"
    section_word: "глава"
    section_chars_range: { min: 40000, max: 70000 }
    document_sections_range: { min: 4, max: 7 }
    structure_skeleton: "стандартная академическая структура: введение / обзор литературы / методология / результаты / обсуждение / заключение / список источников"
    factcheck_density: "enhanced"
    marketing_mode: "minimal"
    compatible_genres: ["monograph"]
    default_for: "0.3.0"

  # ============================================================
  # Format template — used by /book:research-format to generate new formats
  # ============================================================
  .template:
    display_name_ru: ""
    section_word: ""
    section_chars_range: { min: 0, max: 0 }
    document_sections_range: { min: 0, max: 0 }
    structure_skeleton: ""
    factcheck_density: "standard"
    marketing_mode: "one-promo-per-document"
    compatible_genres: []
    default_for: ""
