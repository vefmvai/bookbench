# .book/config.yaml — конфигурация этой книги
# Все параметры можно изменить через /bookbench:config (интерактивно) или вручную.
# Иерархия наследования:
#   ${CLAUDE_PLUGIN_ROOT}/defaults.yaml > этот файл > переопределения в spec.md раздела
# После /bookbench:start значения ниже заполняются из defaults.yaml выбранного жанра.

# ────────────────────────────────────────────────────────────
# book — основные характеристики книги
# Четыре ортогональных измерения любого текста (D-30, см. .bpd/stages/20-.../decisions-20.md):
#   genre    — что пишется (тип работы со стабильными конвенциями)
#   format   — физическая форма (статья / книга / монография / диссертация)
#   audience — кто читает (свободный текст-портрет, не enum)
#   style    — голос автора (собирается при первом разделе, не на /bookbench:start; см. TOV-08)
# Каждое измерение — первоклассная сущность фреймворка.
# ────────────────────────────────────────────────────────────
book:
  title: "TBD"               # читаемое название; используется в маркетинговых артефактах
  genre: popular-science     # выбирает дефолты из defaults.yaml; popular-science | narrative-non-fiction |
                             # monograph | fiction | <user-preset> | pending
                             # pending = жанр будет выбран позже через /bookbench:research-genre.
                             # При pending команды plan-book / plan-section / write-section блокируются
                             # с подсказкой запустить /bookbench:research-genre <slug> или /bookbench:config genre <slug>.
                             # См. lib/start-coach-prompt.md § 3 ветка B3 (D-36).
  format: book               # одно из: article | long-read | book | monograph | dissertation
                             # Расширяется через /bookbench:research-format (сохраняет пресет в ${CLAUDE_PLUGIN_DATA}/user-formats/).
                             # Определяет слово для единицы работы (глава / раздел / часть) и типичные объёмы.
                             # См. decisions-20.md (D-30) и formats-design.md для полных параметров.
  audience: ""               # свободный текст-портрет целевого читателя (от одного предложения до нескольких абзацев)
                             # Заполняется в коуч-режиме /bookbench:start или вручную. По умолчанию пусто.
                             # Для длинных портретов — хранить полный текст в .book/context/audience.md,
                             # а здесь оставить краткое резюме. Влияет на примеры, метафоры, уровень сложности.
                             # См. decisions-20.md (Измерение 4: Аудитория).
  addressing_mode: ""        # регистр обращения к читателю: "ты" | "вы" | "безличное" | "смешанное"
                             # Заполняется в коуч-режиме /bookbench:start (§ 4a). По умолчанию пусто.
                             # Влияет на каждое предложение book-writer и book-editor через
                             # .book/agent-guidelines/{writer,editor}/addressing-rules.md.
                             # См. decisions-24.md (D-37) и lib/start-coach-prompt.md § 4a.
  language: ru               # влияет на языковые антиклише, профиль голоса, маркетинг
  registry_id: "TBD"         # заполняется автоматически через /bookbench:start

# ────────────────────────────────────────────────────────────
# writing — количественные параметры (Q1..Q19 из этапа 11)
# Переопределяются на уровне раздела через spec.md > override_quantitative.
# ────────────────────────────────────────────────────────────
writing:
  section_target_chars: 20000
  section_min_chars: 15000
  section_max_chars: 25000
  writer_checkpoint_step_chars: 5000
  emotional_addresses_per_section:
    min: 3
    max: 4
  transition_min_chars: 1500
  transition_min_paragraphs: 3
  pyramid_supports_per_section:
    min: 3
    max: 4
  concrete_anchors_per_abstract_claim:
    min: 2
    max: 4
  modern_examples_year_range:
    from: 2020
    to: 2024
  editor_reduction_target_percent: 10
  audit_pass_count: 2
  forbid_math_formulas: true
  forbid_code_blocks: true
  dash_type: medium
  twitter_snippet_chars:
    min: 140
    max: 150
  telegram_post_chars:
    min: 1000
    max: 2000
  midjourney_prompt_words:
    min: 50
    max: 100
  alternative_concepts_count:
    min: 3
    max: 5
  summary_max_words: 500

# ────────────────────────────────────────────────────────────
# agents — конфигурация команды
# ────────────────────────────────────────────────────────────
# Иерархия выбора модели (от наименьшего к наибольшему приоритету):
#   ${CLAUDE_PLUGIN_ROOT}/defaults.yaml.profiles.<profile>.<role>
#     → поле `agents.profile` этого файла выбирает профиль
#       → поле `agents.model_overrides.<role>` этого файла — последнее слово
# Переопределение модели на уровне раздела (spec.md) намеренно не поддерживается —
# см. PS-14.1-04.
agents:
  enabled:
    - coordinator
    - strategist
    - writer
    - factchecker
    - editor
    - marketer
    - classifier
    - synthesizer
    - tuner

  # profile — какой именованный профиль из defaults.yaml управляет выбором модели.
  # Допустимые значения: budget | balanced | quality
  #   budget    — планы Claude Pro; творческое ядро на Opus, остальные
  #               на Haiku (factchecker сохраняет Sonnet для нюансов).
  #   balanced  — Claude Max-5x; рекомендуемый дефолт.
  #   quality   — Claude Max-20x или API; переводит synthesizer на Opus.
  profile: balanced

  # model_overrides — последнее слово, переопределение по роли поверх профиля.
  # По умолчанию пусто. Используется для фиксации конкретной модели для конкретной роли
  # без изменения всего профиля.
  # Пример (раскомментировать и отредактировать):
  #   model_overrides:
  #     writer: opus            # принудительно Opus даже если профиль `budget`
  #     factchecker: haiku      # дешёвый режим для черновой проверки
  model_overrides: {}

  # models — явные пины модели по роли (информационно; профиль + model_overrides выше —
  # авторитетный источник). Отражает профиль `balanced`, поставляемый с шаблоном;
  # пересчитывается /bookbench:update при смене профиля.
  models:
    coordinator: sonnet
    strategist: opus
    writer: opus
    factchecker: sonnet
    editor: sonnet
    marketer: opus
    classifier: haiku
    synthesizer: sonnet
    tuner: sonnet

  loop_limits:
    factchecker_writer_revise: 3        # DEC-03
    editor_factchecker_recheck: 1

# ────────────────────────────────────────────────────────────
# workflow — параметры процесса работы над книгой
# ────────────────────────────────────────────────────────────
# completion_format — когда секция считается «готовой».
# Дефолт editor_pass_plus_author_approval (этап 22, T8): секция готова когда
# 1) book-editor отдал edited.md и 2) автор явно подтвердил «готово».
# Закрывает I-06: вопрос «когда глава готова» больше не задаётся на /bookbench:start.
# Изменить можно через /bookbench:config workflow.completion_format <value>.
# Допустимые значения:
#   editor_pass_plus_author_approval — дефолт; редактор + явное подтверждение автора
#   editor_only                       — достаточно прохода редактора
#   factcheck_only                    — достаточно прохода фактчекера (для художки без фактов)
#   custom                            — описывается в .book/agent-guidelines/coordinator/
workflow:
  completion_format: editor_pass_plus_author_approval

# ────────────────────────────────────────────────────────────
# quality_gates — пороги pass/fail
# ────────────────────────────────────────────────────────────
quality_gates:
  min_factcheck_pass_rate: 0.95
  max_anti_cliche_violations: 0
  min_cohesion_score: 0.7

# ────────────────────────────────────────────────────────────
# mcp_servers — конфигурация MCP для конкретной книги (опционально)
# Применяется к book-factchecker (и опционально classifier) только.
# Дефолт для 0.1: возвращается к встроенным WebSearch/WebFetch.
# ────────────────────────────────────────────────────────────
mcp_servers:
  factchecker: {}
  # Пример:
  # factchecker:
  #   tavily:
  #     command: npx
  #     args: ["-y", "@tavily/mcp-server"]

# ────────────────────────────────────────────────────────────
# compatibility — привязка версии плагина (управляется автоматически)
# ────────────────────────────────────────────────────────────
compatibility:
  created_with_bookbench: "0.1.0"
  compatible_bookbench: "^0.1"
  last_synced_with: "0.1.0"

# ────────────────────────────────────────────────────────────
# privacy — для evolver и межкнижного обмена
# ────────────────────────────────────────────────────────────
privacy:
  private: false
  include_in_evolver: true

# ────────────────────────────────────────────────────────────
# Schema version — увеличивается при несовместимых изменениях (см. CFG-3)
# ────────────────────────────────────────────────────────────
schema_version: 1
